# Docs for the Azure Web Apps Deploy action:
# https://github.com/Azure/webapps-deploy

name: Build and deploy ASP.NET Core app to Azure Web App - mochu-api-channer

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build backend
        run: dotnet build ./Ajir.Api/Ajir.Api.csproj --configuration Release

      - name: Publish backend
        run: dotnet publish ./Ajir.Api/Ajir.Api.csproj --configuration Release --output ${{ env.DOTNET_ROOT }}/myapp

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{ env.DOTNET_ROOT }}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E1E76A1C3EFE4CF7B3D1A31F596C62EA }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D3C2094E5656414B9201E8A0F27D5CA5 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E73A2CF7C92740D28A0EEB2352F5B665 }}

      - name: Deploy backend to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'mochu-api-channer'
          slot-name: 'Production'
          package: .
          
